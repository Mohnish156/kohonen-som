[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "som"
version = "0.1.0"
description = "A vectorised, production-oriented Kohonen Self-Organising Map"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0", "python-multipart>=0.0.9", "matplotlib>=3.7"]

[project.scripts]
som-train = "som.training.__main__:main"
som-serve = "som.serving.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]
extend-exclude = ["original", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
